<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator">
        <input type="text" class="calculator-screen" value="" disabled>
        <div class="calculator-buttons">
            <!-- Row 1: Top Control Functions -->
            <button class="btn function" value="C">AC</button>
            <button class="btn function" value="">±</button>
            <button class="btn function" value="">%</button>
            <button class="btn operator" value="/">÷</button>

            <!-- Row 2 -->
            <button class="btn" value="7">7</button>
            <button class="btn" value="8">8</button>
            <button class="btn" value="9">9</button>
            <button class="btn operator" value="*">×</button>

            <!-- Row 3 -->
            <button class="btn" value="4">4</button>
            <button class="btn" value="5">5</button>
            <button class="btn" value="6">6</button>
            <button class="btn operator" value="-">−</button>

            <!-- Row 4 -->
            <button class="btn" value="1">1</button>
            <button class="btn" value="2">2</button>
            <button class="btn" value="3">3</button>
            <button class="btn operator" value="+">+</button>

            <!-- Row 5: Wide Layout Zero Anchor -->
            <button class="btn btn-zero" value="0">0</button>
            <button class="btn" value=".">.</button>
            <button class="btn operator" value="=">=</button>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
